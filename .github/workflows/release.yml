name: release
# Publication/owner checks: D-105. Candidate qualification: D-144. Final artifacts: D-146.
# Builds a release package by hand (Actions > release > Run workflow, or gh workflow run release.yml -f version=1.8.0):
# tools/build.py --release <version> (identity FM-1_7MMmmpp, e.g. FM-1_7010800; version string vX.Y.Z), the build safeguards of
# firmware.yml, and uploads release-<version>/ with the build log. Full host checks require explicit rc mode. It does not tag or publish: see "Releasing" in
# docs/ARCHITECTURE.md. It also uploads the M1_EMU_MIDI=1 build of the same sources (matryoshka-emu-midi), for the boot check of the
# release bytes before they go on the test rig (#783).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z or X.Y.Z-suffix, each 0..99 (e.g. 1.8.0, 1.8.0-rc1)"
        required: true
      mode:
        description: 'package builds only; rc explicitly runs full host checks on the frozen source'
        type: choice
        options: [package, rc]
        default: package
      rc_sha:
        description: 'exact frozen 40-character commit (required for rc mode)'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rc_sha || github.sha }}
      - name: Record package-only scope or explicit frozen-candidate host checks
        run: python3 tools/ci_checks.py plan --area firmware --allow-package
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: JieLi toolchain and AC79 SDK (cached)
        id: jieli
        uses: actions/cache@v5
        with:
          path: ~/.jieli
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-toolchain-v1
      - name: fetch the toolchain and the three SDK files
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          tools/get_toolchain.sh
          git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk
          git -C ~/.jieli/ac79-sdk sparse-checkout set cpu/wl82/tools
          git -C ~/.jieli/ac79-sdk checkout
      - name: the generated headers are current
        working-directory: web
        run: |
          npm run export-defs
          git diff --exit-code ../firmware/src/defs.h ../firmware/src/presets.h ../firmware/src/controls.h ../firmware/src/aot_gen.h ../firmware/test/pmig_cases.h ../README.md || { echo "::error::generated firmware files are stale: run 'npm run export-defs' and commit"; exit 1; }
      - name: build the release, no warnings, pool headroom >= 8 KB
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          mkdir -p build
          python3 tools/build.py --release "$VERSION" 2>&1 | tee build/build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings"; exit 1; fi
          cp build/build.log "build/release-$VERSION/"
          { echo "### Matryoshka $VERSION ($(git rev-parse HEAD))"; echo '```'; grep -E "image [0-9]+ B|pool [0-9]+ B of|identity" build/build.log; cat "build/release-$VERSION/SHA256SUMS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Full host checks only for explicit candidate qualification
        if: inputs.mode == 'rc'
        run: python3 tools/ci_checks.py run --area firmware
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-release-${{ inputs.version }}
          path: build/release-${{ inputs.version }}/
          if-no-files-found: error
      # after the package's upload, so this build cannot touch it (tools/build.py writes release-<version>/ only with --release)
      - name: the emulator bridge's build of the same sources (M1_EMU_MIDI=1, never installed; the boot check of the release bytes, docs/EMULATOR.md, #783)
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          M1_EMU_MIDI=1 python3 tools/build.py 2>&1 | tee build/build-emu.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build-emu.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings (M1_EMU_MIDI=1)"; exit 1; fi
          mkdir -p build/emu-midi
          cp build/matryoshka.bin build/emu-midi/matryoshka-emu.bin
          cp build/matryoshka.elf build/emu-midi/matryoshka-emu.elf
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-emu-midi
          path: build/emu-midi/
          if-no-files-found: error
