name: deploy
# Publishes the web app (editor, presets, flasher and the committed, device-tested firmware package in web/public/firmware/)
# to Cloudflare Pages, and the forwarder (deploy/github-pages-forward) to GitHub Pages:
#   https://matry0shka.pages.dev/  (the Cloudflare Pages project `matry0shka`; `matryoshka` was taken; the address is SITE_URL in web/src/site.ts)
#   https://glvno.github.io/matryoshka/  (the old address: forwards there, and offers to bring the browser data along)
# The firmware is not built here: Pages publishes the committed, device-tested package in web/public/firmware/ (made with
# tools/build.py + npm run firmware), so the site never carries a package no device has run.
# One-time setup: the repository secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and the variable CLOUDFLARE_ACCOUNT_ID;
# repository Settings > Pages > Source: GitHub Actions (the github-pages environment deploys only main).
# Runs only on main of glvno/matryoshka; workflow_dispatch on any other branch or in a fork is skipped.
# Also daily (schedule), so the About card's AI usage figures stay fresh between pushes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'glvno/matryoshka'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the FM-1's UI as WebAssembly (firmware/wasm/fm1_ui.c -> public/fm1-ui.wasm): the editor's FM-1 tab and fm1-ui.test.ts
      - name: clang + wasm-ld, the FM-1 UI as WebAssembly
        run: |
          sudo apt-get install -y --no-install-recommends clang lld
          npm run fm1-wasm
      # the tests, with coverage: public/coverage.json is the About card's Test coverage figures
      - run: npm run coverage
      # the About card's AI usage figures: WakaTime summaries of the projects in web/ai-projects.json, fetched with the
      # WAKATIME_API_KEY repository secret; a failed fetch keeps the last good file from the cache (the card shows its date)
      - name: the last good AI usage figures
        uses: actions/cache/restore@v5
        with:
          path: web/public/ai-stats.json
          key: ai-stats-${{ github.run_id }}
          restore-keys: ai-stats-
      - name: fetch the AI usage figures
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: npm run ai-stats
      - name: keep them for the next run
        if: hashFiles('web/public/ai-stats.json') != ''
        uses: actions/cache/save@v5
        with:
          path: web/public/ai-stats.json
          key: ai-stats-${{ github.run_id }}
      - name: sum the prompt counts (AI_PROMPTS_* variables, set by the pre-push hook in .githooks)
        env:
          GH_VARS: ${{ toJSON(vars) }}
        run: npm run ai-prompts -- collect
      - run: npm run build
      - name: the firmware package must be there
        run: |
          test -s dist/firmware/matryoshka.fwsc && test -s dist/firmware/matryoshka.json && test -s dist/firmware/FM-1_015.fwsc && test -s dist/firmware/NOTICE-FM-1_015.txt
          grep -Eq '"product":"FM-1_7[0-9][0-9]"' dist/firmware/matryoshka.json
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=matry0shka --branch=main

  # the old address serves only the forwarder, after the app is up at the new one
  forward:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/github-pages-forward
      - id: deployment
        uses: actions/deploy-pages@v5
