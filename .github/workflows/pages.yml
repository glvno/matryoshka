name: pages
# Builds the firmware (JieLi toolchain + AC79 SDK files), then publishes the web app (editor, presets, flasher and the freshly built firmware package) to GitHub Pages:
#   https://glvno.github.io/matryoshka/ (repository: glvno/matryoshka)
# One-time setup: repository Settings > Pages > Source: GitHub Actions. The github-pages environment
# deploys only main; workflow_dispatch on any other branch is skipped.
# Also daily (schedule), so the About card's AI usage figures stay fresh between pushes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: JieLi toolchain and AC79 SDK (cached)
        id: jieli
        uses: actions/cache@v5
        with:
          path: ~/.jieli
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-toolchain-v1
      - name: fetch the toolchain and the three SDK files
        if: steps.jieli.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          tools/get_toolchain.sh
          git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk
          git -C ~/.jieli/ac79-sdk sparse-checkout set cpu/wl82/tools
          git -C ~/.jieli/ac79-sdk checkout
      - name: build the firmware package
        working-directory: .
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          (cd web && npm run export-defs)
          python3 tools/build.py
          (cd web && npm run firmware)
      # the FM-1's UI as WebAssembly (firmware/wasm/fm1_ui.c -> public/fm1-ui.wasm): the editor's FM-1 tab and fm1-ui.test.ts
      - name: clang + wasm-ld, the FM-1 UI as WebAssembly
        run: |
          sudo apt-get install -y --no-install-recommends clang lld
          npm run fm1-wasm
      # the tests, with coverage: public/coverage.json is the About card's Test coverage figures
      - run: npm run coverage
      # the About card's AI usage figures: WakaTime summaries of the projects in web/ai-projects.json, fetched with the
      # WAKATIME_API_KEY repository secret; a failed fetch keeps the last good file from the cache (the card shows its date)
      - name: the last good AI usage figures
        uses: actions/cache/restore@v5
        with:
          path: web/public/ai-stats.json
          key: ai-stats-${{ github.run_id }}
          restore-keys: ai-stats-
      - name: fetch the AI usage figures
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: npm run ai-stats
      - name: keep them for the next run
        if: hashFiles('web/public/ai-stats.json') != ''
        uses: actions/cache/save@v5
        with:
          path: web/public/ai-stats.json
          key: ai-stats-${{ github.run_id }}
      - run: npm run build
      - name: the firmware package must be there
        run: test -s dist/firmware/modular-1.fwsc && test -s dist/firmware/modular-1.json && test -s dist/firmware/FM-1_015.fwsc && test -s dist/firmware/NOTICE-FM-1_015.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
