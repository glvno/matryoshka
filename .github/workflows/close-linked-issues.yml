# GitHub closes "Closes #N" issues only when a pull request merges into the
# default branch. Most work merges into release-* or dev-next first, so this
# closes them there (D-072 in docs/ledger/project.md).
name: close-linked-issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close issues named by closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          nums=$(printf '%s\n%s\n' "$TITLE" "$BODY" \
            | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un)
          for n in $nums; do
            state=$(gh api "repos/$GH_REPO/issues/$n" --jq 'select(.pull_request == null) | .state' 2>/dev/null) || continue
            [ "$state" = open ] || continue
            gh issue close "$n" --reason completed \
              --comment "Closed by #$PR, merged into \`$BASE\`. It reaches users with the release that ships \`$BASE\`."
          done
