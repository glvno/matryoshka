name: web
on:
  push:
  pull_request:

# a newer run for the same branch / PR replaces an older one still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the factory assemblies (src/assemblies/*.json) are generated: made again from gen-assemblies.ts, they must be the
      # committed files (a module that gains a parameter, as the Oscillator's pm2 / pm3, changes them too)
      - name: generated factory assemblies are current
        run: |
          npx vite-node scripts/gen-assemblies.ts
          git diff --exit-code src/assemblies src/preset-lineage.json src/preset-migrations.json || { echo "::error::src/assemblies/*.json or the preset lineage (src/preset-lineage.json, src/preset-migrations.json, D-865) are stale: run 'npx vite-node scripts/gen-assemblies.ts' (then gen-presets.ts, legacy-factory.ts and export-defs) and commit"; exit 1; }
      # the FM-1's UI as WebAssembly (firmware/wasm/fm1_ui.c -> public/fm1-ui.wasm): the editor's FM-1 tab and fm1-ui.test.ts
      - name: clang + wasm-ld, the FM-1 UI as WebAssembly
        run: |
          sudo apt-get install -y --no-install-recommends clang lld
          npm run fm1-wasm
      - run: npm test
      - run: npm run build
  # the factory patches (presets/*.json, their cards and levels) are generated too: gen-presets.ts from the committed
  # assemblies must give the committed files (an engine change moves the loudness levels; players() reads the CPU estimate)
  presets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generated factory patches are current
        run: |
          npx vite-node scripts/gen-presets.ts
          if [ -n "$(git status --porcelain -- presets src/assemblies)" ]; then git status --short -- presets src/assemblies; git diff --stat -- presets src/assemblies; echo "::error::presets/*.json (or their cards / levels) are stale: run 'npx vite-node scripts/gen-presets.ts', then gen-xl.ts, legacy-factory.ts and export-defs, and commit"; exit 1; fi
  # the XLs (presets/xl/*.json) from gen-xl.ts and the committed FM-1 patches (#719: an appended parameter or a regenerated
  # FM-1 patch left them stale); four shards at once, one per core (Spokes 6 XL alone takes most of the time)
  xl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generated XLs are current
        run: |
          for i in 0 1 2 3; do npx vite-node scripts/gen-xl.ts --shard $i/4 > /tmp/xl-$i.log 2>&1 & pids="$pids $!"; done
          fail=0; for p in $pids; do wait $p || fail=1; done
          cat /tmp/xl-*.log
          test $fail -eq 0
          if [ -n "$(git status --porcelain -- presets/xl)" ]; then git status --short -- presets/xl; git diff --stat -- presets/xl; echo "::error::presets/xl/*.json are stale: run 'npx vite-node scripts/gen-xl.ts' and commit"; exit 1; fi
  # the CPU table (src/cpu-costs.json, #718): counted on the rv32 model with the clang in tools/cpu/clang-version (the counts
  # follow the compiler, so the check uses exactly that one: LLVM's release build, its clang, lld and headers cached)
  cpu-costs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tools/cpu/build.sh reads the M1-0.2 engine (b907693) with git show
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: the pinned clang (cached)
        id: llvm
        uses: actions/cache@v5
        with:
          path: ~/llvm-cpu
          key: llvm-cpu-${{ hashFiles('tools/cpu/clang-version') }}-linux-x64-v1
      - name: fetch the pinned clang (LLVM's release build, only clang, lld and the compiler's headers)
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          V=$(cat ../tools/cpu/clang-version); D="LLVM-$V-Linux-X64"
          mkdir -p ~/llvm-cpu
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$V/$D.tar.xz" \
            | tar -xJ -C ~/llvm-cpu --strip-components=1 "$D/bin/clang" "$D/bin/clang-${V%%.*}" "$D/bin/lld" "$D/bin/ld.lld" "$D/lib/clang/${V%%.*}/include"
      - name: the CPU table is current
        run: |
          export PATH="$HOME/llvm-cpu/bin:$PATH"
          V=$(cat ../tools/cpu/clang-version)
          CV=$(clang --version | head -n 1 || true)
          case "$CV " in *" version $V "*) ;; *) echo "::warning::skipped: '$CV' is not clang $V (tools/cpu/clang-version), and the counts follow the compiler"; exit 0;; esac
          npm run cpu-costs > /tmp/cpu-costs.log 2>&1 || { cat /tmp/cpu-costs.log; exit 1; }
          tail -3 /tmp/cpu-costs.log
          git diff --exit-code --stat src/cpu-costs.json || { echo "::error::src/cpu-costs.json is stale: run 'npm run cpu-costs' (clang $V) and commit"; exit 1; }
