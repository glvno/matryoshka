name: ledger-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ledger-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the decision ledger
        run: |
          if ! python3 tools/ledger_check.py; then
            echo "::error::Decision ledger check failed. Run 'python3 tools/ledger_check.py --fix' locally, then commit what it changed."
            exit 1
          fi
