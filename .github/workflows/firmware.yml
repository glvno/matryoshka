name: firmware
# Builds the firmware with the JieLi toolchain on every push that touches it (paths below) and every pull request that does and fails on compiler warnings or on a
# pool headroom below 8 KB (tools/build.py). Then the host tests that need a C compiler: the golden vectors (web engine
# vs firmware engine), the arpeggiator, protocol, USB audio and panel tests, the LCD preview. The .fwsc and .bin are kept as an artifact
# (the emulator smoke test, npm run emu:smoke, downloads them; not for the only device: see the fork's issue 1).
on:
  push:
    paths:
      # what the build, the generated-header check and the golden vectors read: firmware/, tools/, and the web files
      # scripts/export-defs.ts and scripts/golden.ts import (keep in step when they gain imports)
      - firmware/**
      - tools/**
      - .github/workflows/firmware.yml
      - web/presets/**
      - web/package-lock.json
      - web/scripts/export-defs.ts
      - web/scripts/legacy-factory.json
      - web/scripts/golden.ts
      - web/src/arpeggiator.ts
      - web/src/assembly.ts
      - web/src/cpu-costs.json
      - web/src/cpu.ts
      - web/src/device-compile.ts
      - web/src/engine.ts
      - web/src/fallback.ts
      - web/src/labels.ts
      - web/src/rate-envelope.ts
      - web/src/modules.ts
      - web/src/parameter-routing.ts
      - web/src/patch.ts
      - web/src/patchbin.ts
      - web/src/poly.ts
      - web/src/presets.ts
      - web/src/protocol.ts
      - web/src/test-patches.ts
      - web/src/test-poly.ts
      - web/src/track.ts
      - web/src/wavetables.json
      - web/src/arm.ts
      - web/src/assemblies.ts
      - web/src/assemblies/**
      - web/src/buttons.ts
      - web/src/device-presets.ts
      - web/src/engines.ts
      - web/src/factory-presets.ts
      - web/src/knob-migrate.ts
      - web/src/pages.ts
      - web/src/storage-key.ts
      - web/src/structure.ts
  # every pull request runs, so `build` can be a required check; the changes job skips the build (a skipped job passes)
  # when the pull request touches none of the push paths above
  pull_request:
  workflow_dispatch:

# a newer run for the same branch / PR replaces an older one still running (a push that skips this workflow cancels nothing)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: does this change touch the firmware (the push paths above)?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "firmware=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - "$BASE" <<'PY'
          import os, re, subprocess, sys
          wf = open('.github/workflows/firmware.yml').read()
          block = wf.split('  push:\n    paths:\n', 1)[1].split('\n  pull_request:', 1)[0]
          pats = re.findall(r'^\s+- (\S+)$', block, re.M)
          files = subprocess.run(['git', 'diff', '--name-only', sys.argv[1] + '...HEAD'], capture_output=True, text=True, check=True).stdout.split()
          hit = [f for f in files for p in pats if (f.startswith(p[:-2]) if p.endswith('/**') else f == p)]
          print('firmware paths changed:', sorted(set(hit)) or 'none')
          open(os.environ['GITHUB_OUTPUT'], 'a').write('firmware=%s\n' % ('true' if hit else 'false'))
          PY
  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: JieLi toolchain and AC79 SDK (cached)
        id: jieli
        uses: actions/cache@v5
        with:
          path: ~/.jieli
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-toolchain-v1
      - name: fetch the toolchain and the three SDK files
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          tools/get_toolchain.sh
          git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk
          git -C ~/.jieli/ac79-sdk sparse-checkout set cpu/wl82/tools
          git -C ~/.jieli/ac79-sdk checkout
      - name: the generated headers are current
        working-directory: web
        run: |
          npm run export-defs
          git diff --exit-code ../firmware/src/defs.h ../firmware/src/presets.h || { echo "::error::defs.h / presets.h are stale: run 'npm run export-defs' and commit"; exit 1; }
      - name: build the firmware, no warnings, pool headroom >= 8 KB
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          mkdir -p build
          python3 tools/build.py 2>&1 | tee build/build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings"; exit 1; fi
          grep -E "pool [0-9]+ B of [0-9]+" build/build.log
      - name: golden vectors, protocol, USB audio, panel and preset store tests, LCD preview
        run: |
          export
          tools/golden.sh
          tools/usb_test.sh
          tools/panel_test.sh
          tools/preset_test.sh
          tools/ui_preview.sh build/ui-preview.png 0 1
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-firmware
          path: |
            build/matryoshka.fwsc
            build/matryoshka.json
            build/matryoshka.bin
            build/ui-preview.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-elf
          path: |
            build/matryoshka.elf
            build/matryoshka.dis
          if-no-files-found: error
      - name: the emulator bridge's build (M1_EMU_MIDI=1, never installed; docs/EMULATOR.md, #290)
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          sha256sum build/matryoshka.bin | tee build/normal.sha256
          M1_EMU_MIDI=1 python3 tools/build.py 2>&1 | tee build/build-emu.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build-emu.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings (M1_EMU_MIDI=1)"; exit 1; fi
          mkdir -p build/emu-midi
          cp build/matryoshka.bin build/emu-midi/matryoshka-emu.bin
          cp build/matryoshka.elf build/emu-midi/matryoshka-emu.elf
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-emu-midi
          path: build/emu-midi/
          if-no-files-found: error
