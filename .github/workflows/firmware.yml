name: firmware
# Required build safeguards remain on targeted changes. Full host suites require an explicit frozen RC.
# The reviewed path/test plan is tools/ci_checks.json; no workflow parses its own YAML.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'targeted checks or full host checks for a frozen release candidate'
        type: choice
        options: [targeted, rc]
        default: targeted
      base:
        description: 'comparison commit/ref (required for targeted dispatch)'
        type: string
      rc_sha:
        description: 'exact frozen 40-character commit (required for rc mode)'
        type: string
      experiments:
        description: 'also build the development experiment variants'
        type: boolean
        default: false

# a newer run for the same branch / PR replaces an older one still running (a push that skips this workflow cancels nothing)
concurrency:
  group: ${{ github.workflow }}-${{ inputs.mode == 'rc' && format('rc-{0}', inputs.rc_sha) || github.ref }}
  cancel-in-progress: ${{ inputs.mode != 'rc' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_sha || github.sha }}
      - name: Test the CI selector
        run: python3 tools/ci_checks_test.py
      # Required `build` propagates either area's planning failure, even for web-only paths.
      - name: Validate the web test plan too
        run: python3 tools/ci_checks.py plan --area web --file build/ci-web-plan.json
      - name: Plan checks from changed domains or a frozen candidate
        id: diff
        run: python3 tools/ci_checks.py plan --area firmware

  build:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.firmware == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: The check plan must pass
        if: needs.changes.result != 'success'
        run: echo 'Check planning failed; a reviewed test plan is required.'; exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_sha || github.sha }}
      - name: Recreate the check plan for this checkout
        run: python3 tools/ci_checks.py plan --area firmware
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: JieLi toolchain and AC79 SDK (cached)
        id: jieli
        uses: actions/cache@v5
        with:
          path: ~/.jieli
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-toolchain-v1
      - name: fetch the toolchain and the three SDK files
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          tools/get_toolchain.sh
          git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk
          git -C ~/.jieli/ac79-sdk sparse-checkout set cpu/wl82/tools
          git -C ~/.jieli/ac79-sdk checkout
      - name: the generated headers are current
        working-directory: web
        run: |
          npm run export-defs
          git diff --exit-code ../firmware/src/defs.h ../firmware/src/presets.h ../firmware/src/controls.h ../firmware/src/aot_gen.h ../firmware/test/pmig_cases.h ../README.md || { echo "::error::defs.h / presets.h / controls.h / aot_gen.h / test/pmig_cases.h / the README's controls are stale: run 'npm run export-defs' and commit"; exit 1; }
      - name: build the firmware, no warnings, pool headroom >= 8 KB
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          mkdir -p build
          python3 tools/build.py 2>&1 | tee build/build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings"; exit 1; fi
          grep -E "pool [0-9]+ B of [0-9]+" build/build.log
      - name: Host checks selected for this scope
        run: python3 tools/ci_checks.py run --area firmware
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-firmware
          path: |
            build/matryoshka.fwsc
            build/matryoshka.json
            build/matryoshka.bin
            build/ui-preview.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-elf
          path: |
            build/matryoshka.elf
            build/matryoshka.dis
          if-no-files-found: error
      - name: the emulator bridge's build (M1_EMU_MIDI=1, never installed; docs/EMULATOR.md, #290)
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          sha256sum build/matryoshka.bin | tee build/normal.sha256
          M1_EMU_MIDI=1 python3 tools/build.py 2>&1 | tee build/build-emu.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build-emu.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings (M1_EMU_MIDI=1)"; exit 1; fi
          mkdir -p build/emu-midi
          cp build/matryoshka.bin build/emu-midi/matryoshka-emu.bin
          cp build/matryoshka.elf build/emu-midi/matryoshka-emu.elf
      - uses: actions/upload-artifact@v4
        with:
          name: matryoshka-emu-midi
          path: build/emu-midi/
          if-no-files-found: error

      - name: comparison builds for the development experiments
        if: github.event_name == 'workflow_dispatch' && inputs.experiments
        run: |
          sudo apt-get install -y --no-install-recommends llvm
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          # Each experiment uses the same size-optimized baseline. The normal build above uses -O2 on the audio path.
          for variant in size aot ram aot-ram; do
            aot=0; ram=0
            case "$variant" in aot) aot=1;; ram) ram=1;; aot-ram) aot=1; ram=1;; esac
            mkdir -p "build/variants/$variant"
            ENG_AOT=$aot ENG_RAMCODE=$ram FELUCCA_SPEED=0 python3 tools/build.py 2>&1 | tee "build/variants/$variant/build.log"
            test "${PIPESTATUS[0]}" -eq 0
            if grep -E "warning:" "build/variants/$variant/build.log" | grep -v "SDK .* differs"; then exit 1; fi
            cp build/matryoshka.bin build/matryoshka.fwsc build/matryoshka.json build/matryoshka.elf "build/variants/$variant/"
            M1_EMU_MIDI=1 ENG_AOT=$aot ENG_RAMCODE=$ram FELUCCA_SPEED=0 python3 tools/build.py 2>&1 | tee "build/variants/$variant/bridge.log"
            test "${PIPESTATUS[0]}" -eq 0
            if grep -E "warning:" "build/variants/$variant/bridge.log" | grep -v "SDK .* differs"; then exit 1; fi
            cp build/matryoshka.bin "build/variants/$variant/matryoshka-emu.bin"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.experiments
        with:
          name: matryoshka-experiments
          path: build/variants/
          if-no-files-found: error
